title: "Region Area\n→ Param"
tooltip: >-
  Writes the computed area of one or many Filled Regions into a writable parameter
  (for example 'Region Area' on the energy elevations), with a before/after preview
  that must be confirmed before anything is written. Building and Side can be filled
  in the same run.
author: ARYE
assembly: ../../../bin/ARYE.OfficeTools.dll
command_class: ARYE.OfficeTools.Commands.CommandRegionAreaToParameter
